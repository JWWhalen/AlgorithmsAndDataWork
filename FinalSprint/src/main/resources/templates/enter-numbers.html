<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Numbers</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 2rem;
            color: #343a40;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 class="text-center">Enter Numbers</h1>
        <form action="/process-numbers" method="post" class="text-center">
            <div class="form-group">
                <input type="text" name="numbers" class="form-control" placeholder="Enter numbers separated by commas" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        <div class="text-center mt-3">
            <a href="/previous-trees" class="btn btn-secondary">Show Previous Trees</a>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Trees</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 2rem;
            color: #343a40;
        }
        .tree-list {
            font-size: 1rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1 class="text-center">Previous Trees</h1>
        <ul class="tree-list">
            <li th:each="tree : ${trees}">
                <p>Numbers: <span th:text="${tree.numbers}"></span></p>
                <p>Tree JSON: <pre th:text="${tree.treeJson}"></pre></p>
            </li>
        </ul>
        <div class="text-center">
            <a href="/enter-numbers" class="btn btn-primary">Enter More Numbers</a>
        </div>
    </div>
</div>
</body>
</html>
